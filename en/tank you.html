<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You!</title>
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .message {
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #ffa500;
        }
        h1 { color: #ffa500; }
        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #4a90e2;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        a:hover { background: #357ae8; }
    </style>
</head>
<body>
    <div class="message">
        <h1>🎉 Thank you for your comment!</h1>
        <p>Your feedback is very important to us.</p>
        <a href="index.html">← Back to games</a>
    </div>
</body>
</html>
