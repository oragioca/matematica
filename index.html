<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giochi di Matematica | Oragioca</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #6d5a8c;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            box-sizing: border-box;
        }

        .riquadro {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 28px;
            padding: 40px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
        }

        .container {
            max-width: 800px;
            text-align: center;
            color: white;
            margin: 0 auto;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        h2 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            font-weight: normal;
            opacity: 0.9;
        }

        .scelta {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            color: #333;
            padding: 15px;
            border-radius: 12px;
            width: 250px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 12px 20px rgba(0,0,0,0.3);
        }

        .card h2 {
            margin-top: 0;
            color: #667eea;
            font-size: 1.2rem;
        }

        .emoji {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .istruzioni {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.8);
            text-align: center;
            margin: 10px 0 20px 0;
        }

        .linea {
            border-top: 1px solid rgba(255,255,255,0.2);
            margin: 0 0 20px 0;
        }

        .copyright {
            font-size: 0.65rem;
            color: rgba(255,255,255,0.6);
            text-align: center;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }
            .riquadro {
                padding: 20px;
            }
            .scelta {
                flex-direction: column;
                align-items: center;
            }
            h1 {
                font-size: 2rem;
            }
            .istruzioni {
                font-size: 0.65rem;
            }
        }
    </style>
</head>
<body>
    <div class="riquadro">
        <div class="container">
            <h1>Giochi di Matematica</h1>
            <h2><small> con quesiti dell'archivio Invalsi</small></h2>
            <p><small>Scegli la scuola e clicca per giocare</small></p>
        
            <div class="scelta">
                <div class="card" onclick="location.href='primaria/index.html'">
                    <div class="emoji">📚</div>
                    <h2>Scuola Primaria</h2>
                </div>
                <div class="card" onclick="location.href='secondaria/index.html'">
                    <div class="emoji">🧑‍🎓</div>
                    <h2>Scuola Secondaria</h2>  
                    <small>di Primo Grado</small>
                </div>
            </div>

            <!-- Istruzione posizionata subito dopo le card, sopra la linea -->
            <div class="istruzioni">
              <small>  Per uscire dal gioco, chiudi questa scheda <br> </small> 
            </div>

            <!-- Linea orizzontale -->
            <div class="linea"></div>

            <div class="copyright">
                © RG 2026 Oragioca - Tutti i diritti riservati.
            </div>
        </div>
    </div>
</body>
</html>
