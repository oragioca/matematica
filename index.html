<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giochi di Matematica | Oragioca</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 40px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .container {
            max-width: 800px;
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        h2 {
            font-size: 1.2rem;
            margin-bottom: 30px;
            font-weight: normal;
            opacity: 0.9;
        }
        .scelta {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }
        .card {
            background: white;
            color: #333;
            padding: 30px;
            border-radius: 15px;
            width: 250px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }
        .card h2 {
            margin-top: 0;
            color: #667eea;
            font-size: 1.5rem;
        }
        .card p {
            color: #666;
            margin: 10px 0;
        }
        .emoji {
            font-size: 4rem;
            margin-bottom: 15px;
        }
        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.2);
            font-size: 0.8rem;
            color: rgba(255,255,255,0.7);
        }
        .footer a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        @media (max-width: 600px) {
            .scelta {
                flex-direction: column;
                align-items: center;
            }
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧮 Giochi di Matematica 🧮</h1>
	<h2>con quesiti dell'archivio Invalsi</h2>
        <h2>Ottimizzato per il desktop</h2>
        <p>Scegli il livello scolastico e clicca per giocare</p>
	
        <div class="scelta">
            <div class="card" onclick="location.href='primaria/index.html'">
                <div class="emoji">📚</div>
                <h2>Scuola Primaria</h2>
            </div>
            <div class="card" onclick="location.href='secondaria/index.html'">
                <div class="emoji">🧑‍🎓</div>
                <h2>Scuola Secondaria</h2>
               
            </div>
        </div>
        <!-- Footer con copyright -->
        <div class="footer">
            © RG 2026 Oragioca - Tutti i diritti riservati. | 
            <a href="https://oragioca.github.io/matematica/">Home</a>
        </div>
    </div>
</body>
</html>
