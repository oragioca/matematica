<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giochi di Matematica - Scuola Secondaria</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            color: white;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .back-link {
            margin-bottom: 30px;
        }
        .back-link a {
            color: white;
            text-decoration: none;
            background: rgba(255,255,255,0.2);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        .back-link a:hover {
            background: rgba(255,255,255,0.3);
        }
        .giochi-lista {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }
        .gioco-card {
            background: white;
            color: #333;
            border-radius: 10px;
            padding: 15px 5px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }
        .gioco-card:hover {
            transform: scale(1.05);
        }
        .gioco-card a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }
        .emoji-grande {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="back-link">
            <a href="../">← Torna alla Home</a>
        </div>
        <h1>🧑‍🎓 Giochi per la Scuola Secondaria (1ª media)</h1>
        <p>Scegli un gioco e mettiti alla prova!</p>

        <div class="giochi-lista">
            <div class="gioco-card">
                <a href="gioco1.html">
                    <span class="emoji-grande">🧮</span><br>
                    INVALSI Math Game
                </a>
            </div>
            <!-- Qui aggiungerai altri giochi in futuro -->
        </div>
    </div>
</body>
</html>
