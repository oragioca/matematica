<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giochi di Matematica - Scuola Secondaria</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            color: white;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
            display: flex;
            flex-direction: column;
            min-height: 90vh;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .giochi-lista {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            margin: 40px 0;
            flex: 1;
        }
        .gioco-card {
            background: #ffffff;
            color: #333;
            border-radius: 16px;
            padding: 0;
            text-align: center;
            box-shadow: 0 8px 0 #b0b0b0, 0 12px 20px rgba(0,0,0,0.3);
            transition: transform 0.1s, box-shadow 0.1s;
            border: 1px solid #ddd;
            background: linear-gradient(145deg, #f9f9f9, #e6e6e6);
            width: 220px;
            height: 120px;
        }
        .gioco-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 0 #a0a0a0, 0 18px 28px rgba(0,0,0,0.4);
        }
        .gioco-card a {
            text-decoration: none;
            color: #2c3e50;
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 10px;
            box-sizing: border-box;
        }
        .titolo {
            font-weight: 700;
            margin-bottom: 4px;
        }
        .sotto {
            font-size: 0.85rem;
            color: #666;
            font-weight: normal;
        }
        /* Pulsante Torna alla Home in basso */
        .back-home {
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }
        .back-card {
            background: #ffffff;
            color: #333;
            border-radius: 16px;
            padding: 0;
            text-align: center;
            box-shadow: 0 6px 0 #b0b0b0, 0 10px 15px rgba(0,0,0,0.2);
            transition: transform 0.1s, box-shadow 0.1s;
            border: 1px solid #ddd;
            background: linear-gradient(145deg, #f9f9f9, #e6e6e6);
            width: 200px;
            height: 50px;
        }
        .back-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 0 #a0a0a0, 0 12px 20px rgba(0,0,0,0.3);
        }
        .back-card a {
            text-decoration: none;
            color: #2c3e50;
            font-weight: 600;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 0 10px;
            box-sizing: border-box;
        }
        @media (max-width: 600px) {
            .giochi-lista {
                gap: 15px;
            }
            .gioco-card {
                width: 180px;
                height: 100px;
            }
            .gioco-card a {
                font-size: 1rem;
            }
            .back-card {
                width: 180px;
                height: 45px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SCEGLI UN GIOCO E BATTI IL RECORD!</h1>
        <p>Quesiti archivio INVALSI!</p>

        <div class="giochi-lista">
            <div class="gioco-card">
                <a href="prima.html">
                    <span class="titolo">Math Game</span>
                    <span class="sotto">Classe Prima</span>
                </a>
            </div>
            <div class="gioco-card">
                <a href="terza.html">
                    <span class="titolo">Math Game</span>
                    <span class="sotto">Classe Terza</span>
                </a>
            </div>
            <div class="gioco-card">
                <a href="terza_08.html">
                    <span class="titolo">PROVA INVALSI 2008</span>
                </a>
            </div>
            <div class="gioco-card">
                <a href="terza_09.html">
                    <span class="titolo">PROVA INVALSI 2009</span>
                </a>
            </div>
            <!-- Nuova card per PROVA INVALSI 2010 -->
            <div class="gioco-card">
                <a href="terza_10.html">
                    <span class="titolo">PROVA INVALSI 2010</span>
                </a>
            </div>
        </div>

        <!-- Pulsante Torna alla Home in basso -->
        <div class="back-home">
            <div class="back-card">
                <a href="../">← Torna alla Home</a>
            </div>
        </div>
    </div>
</body>
</html>
