<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giochi di Matematica - Scuola Secondaria</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #6d5a8c; /* viola chiaro esterno */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }
        /* Riquadro con gradient e angoli arrotondati */
        .riquadro {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 28px;
            padding: 40px;
            max-width: 1100px;
            width: 100%;
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            text-align: center;
            color: white;
        }
        /* Stili per l'icona joystick animata (emoji) */
        .icona-joystick {
            animation: bounce 1.5s infinite;
            display: inline-block;
            font-size: 6rem;
            line-height: 1;
            margin-bottom: 10px;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .sottotitolo {
            font-size: 1.2rem;
            color: rgba(255,255,255,0.9);
            margin-bottom: 40px;
            font-weight: 300;
        }
        .giochi-lista {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            margin: 0 auto 40px;
            width: 100%;
        }
        .gioco-card {
            background: white;
            border-radius: 20px;
            padding: 0;
            text-align: center;
            box-shadow: 0 12px 0 #4a3f6e, 0 15px 25px rgba(0,0,0,0.3);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            width: 240px;
            height: 140px;
            position: relative;
            border: 2px solid #ffffff30;
        }
        .gioco-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 0 #3a2f5a, 0 20px 30px rgba(0,0,0,0.4);
        }
        .gioco-card a {
            text-decoration: none;
            color: #2c3e50;
            font-weight: 600;
            font-size: 1.2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 15px;
            box-sizing: border-box;
            border-radius: 20px;
            background: linear-gradient(145deg, #f9f9f9, #f0f0f0);
        }
        .icona {
            font-size: 2rem;
            margin-bottom: 5px;
        }
        .titolo {
            font-weight: 700;
            margin-bottom: 2px;
            color: #333;
        }
        .sotto {
            font-size: 0.85rem;
            color: #666;
            font-weight: normal;
            background: #e0e0e0;
            padding: 3px 12px;
            border-radius: 30px;
            margin-top: 5px;
        }
        /* Footer (come nella seconda pagina) */
        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.2);
            font-size: 0.8rem;
            color: rgba(255,255,255,0.7);
        }
        .footer a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        @media (max-width: 600px) {
            body { padding: 15px; }
            .riquadro { padding: 25px; }
            h1 { font-size: 1.8rem; }
            .gioco-card {
                width: 200px;
                height: 120px;
            }
            .icona { font-size: 1.8rem; }
            .sotto { font-size: 0.75rem; }
        }
    </style>
</head>
<body>
