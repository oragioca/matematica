<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giochi di Matematica - Scuola Secondaria</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            color: white;
        }
        .sottotitolo {
            font-size: 1.2rem;
            color: rgba(255,255,255,0.9);
            margin-bottom: 40px;
            font-weight: 300;
        }
        .giochi-lista {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            margin: 0 auto 40px;
            width: 100%;
        }
        .gioco-card {
            background: white;
            border-radius: 20px;
            padding: 0;
            text-align: center;
            box-shadow: 0 12px 0 #4a3f6e, 0 15px 25px rgba(0,0,0,0.3);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            width: 240px;
            height: 140px;
            position: relative;
            border: 2px solid #ffffff30;
        }
        .gioco-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 0 #3a2f5a, 0 20px 30px rgba(0,0,0,0.4);
        }
        .gioco-card a {
            text-decoration: none;
            color: #2c3e50;
            font-weight: 600;
            font-size: 1.2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 15px;
            box-sizing: border-box;
            border-radius: 20px;
            background: linear-gradient(145deg, #f9f9f9, #f0f0f0);
        }
        .icona {
            font-size: 2rem;
            margin-bottom: 5px;
        }
        .titolo {
            font-weight: 700;
            margin-bottom: 2px;
            color: #333;
        }
        .sotto {
            font-size: 0.85rem;
            color: #666;
            font-weight: normal;
            background: #e0e0e0;
            padding: 3px 12px;
            border-radius: 30px;
            margin-top: 5px;
        }
        /* Pulsante Torna alla Home (meno arrotondato) */
        .back-home {
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }
        .back-card {
            background: white;
            border-radius: 12px; /* ridotto da 60px a 12px */
            text-align: center;
            box-shadow: 0 6px 0 #4a3f6e, 0 10px 20px rgba(0,0,0,0.2);
            transition: transform 0.1s, box-shadow 0.1s;
            border: 2px solid #ffffff30;
            width: 220px;
            height: 55px;
        }
        .back-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 9px 0 #3a2f5a, 0 14px 25px rgba(0,0,0,0.3);
        }
        .back-card a {
            text-decoration: none;
            color: #2c3e50;
            font-weight: 600;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 0 20px;
            box-sizing: border-box;
            border-radius: 12px; /* coerente con il bordo della card */
            background: linear-gradient(145deg, #f9f9f9, #f0f0f0);
        }
        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .gioco-card {
                width: 200px;
                height: 120px;
            }
            .icona { font-size: 1.8rem; }
            .sotto { font-size: 0.75rem; }
            .back-card { width: 200px; height: 50px; }
            .back-card a { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮</h1>
	<div class="sottotitolo"><strong>SCEGLI UN GIOCO E BATTI IL RECORD!<strong></div>

            </div>
            <!-- Card per Terza 2009 -->
            <div class="gioco-card">

                    <span class="icona">📅</span>

                </a>
            </div>
            <!-- Card per Terza 2010 -->
            <div class="gioco-card">
                <a href="terza_10.html">
                    <span class="icona">📅</span>

                    <span class="sotto">Classe Terza</span>
                </a>
            </div>
            <!-- Card per Terza 2011 -->
            <div class="gioco-card">
                <a href="terza_11.html">
                    <span class="icona">📅</span>
                    <span class="titolo">Math Game 11</span>
                    <span class="sotto">Classe Terza</span>
                </a>
            </div>
        </div>

        <!-- Pulsante Torna alla Home -->
        <div class="back-home">

                <a href="../">← Torna alla Home </a>
            </div>
        </div>
    </div>
</body>
</html>
