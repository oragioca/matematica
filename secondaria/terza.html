<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Math Game - Classe Terza</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* Stili invariati (identici al tuo) - per brevità li ometto ma nel file completo ci sono */
        /* ... */
        .messaggio-verifica, .messaggio-speciale {
            pointer-events: none; /* impedisce ai messaggi di intercettare i click */
        }
        body.messaggio-attivo .bottone {
            pointer-events: none; /* blocca i pulsanti durante i messaggi speciali (opzionale) */
            opacity: 0.7;
        }
        /* ... resto degli stili ... */
    </style>
</head>
<body>
    <!-- ... struttura HTML invariata ... -->
    <script>
        // ==================== AUDIO ====================
        let audioContext;
        let audioInizializzato = false;
        let wowSound, ahiSound, successSound, clickSound, startSound;

        function inizializzaAudio() {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                creaSuoni();
                audioInizializzato = true;
                // Riprendi subito l'audio per evitare ritardi al primo suono
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }
                console.log("Audio inizializzato");
            } catch (e) { 
                console.log("Audio non supportato:", e); 
            }
        }

        function creaSuoni() {
            // ... (stessa funzione) ...
        }

        function playSound(soundBuffer, volume = 0.7) {
            if (!audioInizializzato || !soundBuffer) return;
            try {
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }
                const source = audioContext.createBufferSource();
                source.buffer = soundBuffer;
                const gainNode = audioContext.createGain();
                gainNode.gain.value = volume;
                source.connect(gainNode);
                gainNode.connect(audioContext.destination);
                source.start();
                const durata = soundBuffer.duration;
                gainNode.gain.setValueAtTime(volume, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + durata);
            } catch (e) {}
        }

        function playWowSound() { playSound(wowSound, 0.8); }
        function playTraguardoWowSound() { playSound(wowSound, 1.0); }
        function playAhiSound() { playSound(ahiSound, 0.6); }
        function playSuccessSound() { playSound(successSound, 0.5); }
        function playClickSound() { playSound(clickSound, 0.3); }
        function playStartSound() { playSound(startSound, 0.7); }

        // ==================== VARIABILI GLOBALI ====================
        let punteggio = 0;
        let vite = 3;
        let giocoIniziato = false;
        let gameOver = false;
        let operazioniCorretteConsecutive = 0;
        let aiutiUtilizzatiDomandaCorrente = 0;
        let erroriConsecutivi = 0;
        let timerInterval;
        let tempoRimanente = 5400;
        const TEMPO_TOTALE = 5400;
        let tentativiDomandaCorrente = 0;
        let timeoutProssima = null;
        let indiceDomandaCorrente = 0;
        let messaggioTimeout = null;
        let messaggioSpecialeTimeout = null;
        let prossimaSoglia = 100;

        // ==================== DOMANDE ====================
        const domandeTotali = [ /* ... come da tuo file ... */ ];

        let domande = [];
        function mescolaDomande() {
            domande = [...domandeTotali];
            for (let i = domande.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [domande[i], domande[j]] = [domande[j], domande[i]];
            }
        }

        // ==================== RIFERIMENTI DOM ====================
        const punteggioDisplay = document.getElementById('punteggio-display');
        const viteContainer = document.getElementById('vite-container');
        const tempoDisplay = document.getElementById('tempo-display');
        const messaggioAvvio = document.getElementById('messaggio-avvio');
        const areaDomanda = document.getElementById('area-domanda');
        const contenutoDomanda = document.getElementById('contenuto-domanda');
        const controlliGioco = document.getElementById('controlli-gioco');
        const bottoneVerifica = document.getElementById('bottone-verifica');
        const bottoneAiuto = document.getElementById('bottone-aiuto');
        const bottoneNuova = document.getElementById('bottone-nuova');
        const bottoneSalta = document.getElementById('bottone-salta');
        const errore1 = document.getElementById('errore-1');
        const errore2 = document.getElementById('errore-2');
        const errore3 = document.getElementById('errore-3');
        const contatoreConsecutive = document.getElementById('contatore-consecutive');
        const contatoreAiuti = document.getElementById('contatore-aiuti');
        const rispConsecutiveDiv = document.getElementById('risposte-consecutive');
        const aiutiDiv = document.getElementById('aiuti-utilizzati');
        const messaggioVerifica = document.getElementById('messaggio-verifica');
        const messaggioSpeciale = document.getElementById('messaggio-speciale');
        const body = document.body;

        let domandaCorrente = null;
        let opzioneSelezionata = null;
        let rispostaApertaInput = '';

        // ==================== FUNZIONI UI ====================
        function aggiornaViteUI() {
            if (!viteContainer) return;
            viteContainer.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                const vita = document.createElement('span');
                vita.className = `vita ${i < vite ? 'piena' : 'persa'}`;
                vita.textContent = i < vite ? '😊' : '😐';
                viteContainer.appendChild(vita);
            }
        }

        function aggiornaDisplayPunteggio() {
            if (punteggioDisplay) punteggioDisplay.textContent = punteggio;
        }

        function aggiornaDisplayTempo() {
            if (!tempoDisplay) return;
            const minuti = Math.floor(tempoRimanente / 60);
            const secondi = tempoRimanente % 60;
            tempoDisplay.textContent = `${minuti.toString().padStart(2,'0')}:${secondi.toString().padStart(2,'0')}`;
            if (tempoRimanente <= 60) tempoDisplay.style.color = '#c0392b';
            else if (tempoRimanente <= 180) tempoDisplay.style.color = '#e67e22';
            else tempoDisplay.style.color = '#27ae60';
        }

        function aggiornaIndicatoreErrori() {
            if (!errore1 || !errore2 || !errore3) return;
            errore1.className = 'pallino-errore' + (erroriConsecutivi >= 1 ? ' attivo' : '');
            errore2.className = 'pallino-errore' + (erroriConsecutivi >= 2 ? ' attivo' : '');
            errore3.className = 'pallino-errore' + (erroriConsecutivi >= 3 ? ' attivo' : '');
        }

        function aggiornaUI() {
            if (contatoreConsecutive) contatoreConsecutive.textContent = operazioniCorretteConsecutive;
            if (contatoreAiuti) contatoreAiuti.textContent = aiutiUtilizzatiDomandaCorrente;
            if (rispConsecutiveDiv) rispConsecutiveDiv.style.display = operazioniCorretteConsecutive > 0 ? 'flex' : 'none';
            if (aiutiDiv) aiutiDiv.style.display = aiutiUtilizzatiDomandaCorrente > 0 ? 'flex' : 'none';
        }

        function avviaTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (tempoRimanente > 0) {
                    tempoRimanente--;
                    aggiornaDisplayTempo();
                }
                if (tempoRimanente <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    tempoRimanente = 0;
                    aggiornaDisplayTempo();
                }
            }, 1000);
        }

        function fermaTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
        }

        function mostraMessaggio(testo, classe, speciale = false, durata = 8000) {
            if (!messaggioVerifica) return;
            if (messaggioTimeout) {
                clearTimeout(messaggioTimeout);
                messaggioTimeout = null;
            }
            messaggioVerifica.textContent = testo;
            messaggioVerifica.className = 'messaggio-verifica mostra ' + classe;
            if (speciale) {
                if (classe === 'wow') messaggioVerifica.classList.add('messaggio-wow');
                else if (classe === 'ahi') messaggioVerifica.classList.add('messaggio-ahi');
            }
            messaggioTimeout = setTimeout(() => {
                messaggioVerifica.classList.remove('mostra');
                messaggioTimeout = null;
            }, durata);
        }

        function mostraMessaggioSpeciale(testo, durata = 5000) {
            if (!messaggioSpeciale) return;
            if (messaggioSpecialeTimeout) {
                clearTimeout(messaggioSpecialeTimeout);
                messaggioSpecialeTimeout = null;
            }
            messaggioSpeciale.textContent = testo;
            messaggioSpeciale.classList.add('mostra');
            body.classList.add('messaggio-attivo'); // opzionale: blocca i click sui pulsanti
            messaggioSpecialeTimeout = setTimeout(() => {
                messaggioSpeciale.classList.remove('mostra');
                body.classList.remove('messaggio-attivo');
                messaggioSpecialeTimeout = null;
            }, durata);
            
            if (timeoutProssima) {
                clearTimeout(timeoutProssima);
                timeoutProssima = null;
            }
            timeoutProssima = setTimeout(() => {
                if (!gameOver) mostraDomanda();
                timeoutProssima = null;
            }, durata);
        }

        // ==================== GESTIONE GIOCO ====================
        window.iniziaGioco = function() {
            console.log("iniziaGioco");
            if (giocoIniziato) return;
            giocoIniziato = true;
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }
            playStartSound();
            if (messaggioAvvio) messaggioAvvio.style.display = 'none';
            if (areaDomanda) areaDomanda.style.display = 'flex';
            if (controlliGioco) controlliGioco.style.display = 'flex';
            tempoRimanente = TEMPO_TOTALE;
            aggiornaDisplayTempo();
            avviaTimer();
            mescolaDomande();
            indiceDomandaCorrente = 0;
            mostraDomanda();
        };

        function mostraDomanda() {
            console.log("mostraDomanda, indice:", indiceDomandaCorrente);
            if (messaggioTimeout) {
                clearTimeout(messaggioTimeout);
                messaggioTimeout = null;
            }
            if (messaggioVerifica) messaggioVerifica.classList.remove('mostra');

            if (messaggioSpecialeTimeout) {
                clearTimeout(messaggioSpecialeTimeout);
                messaggioSpecialeTimeout = null;
            }
            if (messaggioSpeciale) messaggioSpeciale.classList.remove('mostra');
            body.classList.remove('messaggio-attivo');

            if (indiceDomandaCorrente >= domande.length) {
                if (contenutoDomanda) contenutoDomanda.innerHTML = '<div class="testo-domanda">🎉 HAI COMPLETATO TUTTE LE DOMANDE! 🎉<br>Complimenti!</div>';
                if (bottoneVerifica) bottoneVerifica.style.display = 'none';
                document.getElementById('tastiera-container').style.display = 'none';
                return;
            }

            domandaCorrente = domande[indiceDomandaCorrente];
            opzioneSelezionata = null;
            tentativiDomandaCorrente = 0;
            aiutiUtilizzatiDomandaCorrente = 0;
            rispostaApertaInput = '';
            if (bottoneAiuto) bottoneAiuto.disabled = false;
            aggiornaUI();

            let html = '';
            if (domandaCorrente.immagine) {
                html += `<img src="${domandaCorrente.immagine}" class="immagine-domanda" alt="Immagine" onerror="this.style.display='none'">`;
            }
            html += `<div class="testo-domanda">${domandaCorrente.testo}</div>`;

            if (domandaCorrente.tipo === 'risposta_aperta') {
                html += `<div class="risposta-aperta-container">
                        <div class="risposta-input-container">
                            <input class="casella-risposta" type="text" id="campo-risposta" placeholder="Scrivi la risposta" inputmode="numeric">
                        </div>
                    </div>`;
                if (contenutoDomanda) contenutoDomanda.innerHTML = html;
                creaTastieraNumerica();
                const campo = document.getElementById('campo-risposta');
                if (campo) {
                    campo.addEventListener('input', function(e) {
                        rispostaApertaInput = e.target.value;
                    });
                }
            } else {
                const opzioniMescolate = mescolaArray(domandaCorrente.opzioni);
                let opzioniHtml = '';
                opzioniMescolate.forEach(op => {
                    opzioniHtml += `<button class="opzione-btn" onclick="selezionaOpzione('${op.replace(/'/g, "\\'")}')">${op}</button>`;
                });
                html += `<div class="opzioni-container">${opzioniHtml}</div>`;
                if (contenutoDomanda) contenutoDomanda.innerHTML = html;
            }

            if (bottoneVerifica) {
                bottoneVerifica.disabled = false;
                bottoneVerifica.style.display = 'inline-block';
            }
        }

        function mescolaArray(array) {
            const a = [...array];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function creaTastieraNumerica() {
            const tastieraContainer = document.getElementById('tastiera-container');
            const tastieraNumerica = document.getElementById('tastiera-numerica');
            if (!tastieraContainer || !tastieraNumerica) return;
            tastieraContainer.style.display = 'block';
            tastieraNumerica.innerHTML = '';

            const numeri = [1,2,3,4,5,6,7,8,9];
            numeri.forEach(n => {
                const btn = document.createElement('button');
                btn.className = 'tasto-numero';
                btn.textContent = n;
                btn.onclick = () => {
                    playClickSound();
                    const campo = document.getElementById('campo-risposta');
                    if (campo) {
                        campo.value += n;
                        rispostaApertaInput = campo.value;
                    }
                };
                tastieraNumerica.appendChild(btn);
            });

            const btn0 = document.createElement('button');
            btn0.className = 'tasto-numero';
            btn0.textContent = '0';
            btn0.onclick = () => {
                playClickSound();
                const campo = document.getElementById('campo-risposta');
                if (campo) {
                    campo.value += '0';
                    rispostaApertaInput = campo.value;
                }
            };
            tastieraNumerica.appendChild(btn0);

            const btnComma = document.createElement('button');
            btnComma.className = 'tasto-numero';
            btnComma.textContent = ',';
            btnComma.onclick = () => {
                playClickSound();
                const campo = document.getElementById('campo-risposta');
                if (campo) {
                    campo.value += ',';
                    rispostaApertaInput = campo.value;
                }
            };
            tastieraNumerica.appendChild(btnComma);

            const btnCanc = document.createElement('button');
            btnCanc.className = 'tasto-numero tasto-cancella';
            btnCanc.textContent = '⌫';
            btnCanc.onclick = () => {
                playClickSound();
                const campo = document.getElementById('campo-risposta');
                if (campo) {
                    campo.value = campo.value.slice(0, -1);
                    rispostaApertaInput = campo.value;
                }
            };
            tastieraNumerica.appendChild(btnCanc);
        }

        window.selezionaOpzione = function(valore) {
            console.log("selezionaOpzione", valore);
            playClickSound();
            opzioneSelezionata = valore;
            document.querySelectorAll('.opzione-btn').forEach(btn => btn.classList.remove('selezionata'));
            document.querySelectorAll('.opzione-btn').forEach(btn => {
                if (btn.textContent === valore) btn.classList.add('selezionata');
            });
        };

        window.verificaRisposta = function() {
            console.log("verificaRisposta");
            if (gameOver) return;
            if (timeoutProssima) {
                clearTimeout(timeoutProssima);
                timeoutProssima = null;
            }

            const domanda = domandaCorrente;
            if (!domanda) return;

            let rispostaUtente = '';
            let isCorretto = false;

            if (domanda.tipo === 'risposta_aperta') {
                rispostaUtente = rispostaApertaInput.trim();
                if (rispostaUtente === '') {
                    mostraMessaggio('Inserisci una risposta!', 'messaggio-info');
                    return;
                }
                let numUtente = parseFloat(rispostaUtente.replace(',', '.'));
                let numCorretto = parseFloat(domanda.corretta.toString().replace(',', '.'));
                if (!isNaN(numUtente) && !isNaN(numCorretto)) {
                    isCorretto = Math.abs(numUtente - numCorretto) < 0.001;
                } else {
                    isCorretto = (rispostaUtente === domanda.corretta);
                }
            } else {
                if (!opzioneSelezionata) {
                    mostraMessaggio('Seleziona una risposta!', 'messaggio-info');
                    return;
                }
                rispostaUtente = opzioneSelezionata;
                isCorretto = (rispostaUtente === domanda.corretta);
            }

            if (isCorretto) {
                if (tentativiDomandaCorrente === 0) {
                    let bonus = Math.floor(tempoRimanente / 600);
                    let puntiTotali = 1 + bonus;
                    punteggio += puntiTotali;
                    operazioniCorretteConsecutive++;
                    
                    mostraMessaggio(`CORRETTO! +${puntiTotali} punti (1 + ${bonus} bonus tempo)`, 'messaggio-corretto');
                    
                    if (operazioniCorretteConsecutive % 5 === 0 && vite < 3) {
                        vite++;
                        playWowSound();
                        mostraMessaggioSpeciale('🎉 WOW! 5 risposte corrette consecutive! +1 vita! 🎉', 5000);
                    }
                    
                    if (punteggio >= prossimaSoglia) {
                        playTraguardoWowSound();
                        mostraMessaggioSpeciale(`🏆 COMPLIMENTI! HAI RAGGIUNTO ${prossimaSoglia} PUNTI! 🏆`, 5000);
                        prossimaSoglia += 100;
                    } else {
                        timeoutProssima = setTimeout(() => {
                            if (!gameOver) mostraDomanda();
                            timeoutProssima = null;
                        }, 2000);
                    }
                    
                    indiceDomandaCorrente++;
                } else {
                    operazioniCorretteConsecutive = 0;
                    indiceDomandaCorrente++;
                    mostraMessaggio('Corretto (nessun punto, hai sbagliato prima)', 'messaggio-info');
                    timeoutProssima = setTimeout(() => {
                        if (!gameOver) mostraDomanda();
                        timeoutProssima = null;
                    }, 2000);
                }
                erroriConsecutivi = 0;
                aggiornaDisplayPunteggio();
                aggiornaViteUI();
                aggiornaIndicatoreErrori();
                aggiornaUI();

                document.getElementById('tastiera-container').style.display = 'none';
            } else {
                tentativiDomandaCorrente++;
                erroriConsecutivi++;
                operazioniCorretteConsecutive = 0;
                playAhiSound();
                mostraMessaggio('ERRATO!', 'messaggio-errato');

                if (erroriConsecutivi >= 3) {
                    vite--;
                    erroriConsecutivi = 0;
                    if (vite <= 0) {
                        gameOver = true;
                        fermaTimer();
                        mostraMessaggio('GAME OVER!', 'messaggio-errato');
                        if (bottoneVerifica) bottoneVerifica.style.display = 'none';
                    } else {
                        mostraMessaggio('Hai perso una vita!', 'messaggio-errato');
                    }
                }
                aggiornaViteUI();
                aggiornaIndicatoreErrori();
                aggiornaUI();
                timeoutProssima = setTimeout(() => {
                    if (!gameOver) mostraDomanda();
                    timeoutProssima = null;
                }, 2000);
            }
        };

        window.mostraAiuto = function() {
            console.log("mostraAiuto");
            if (gameOver || !domandaCorrente) {
                console.log("gameOver o nessuna domanda");
                return;
            }
            if (aiutiUtilizzatiDomandaCorrente === 0) {
                aiutiUtilizzatiDomandaCorrente++;
                punteggio = Math.max(0, punteggio - 2);
                aggiornaDisplayPunteggio();
                aggiornaUI();
                mostraMessaggio('💡 SUGGERIMENTO: ' + domandaCorrente.hint, 'messaggio-info');
                // Disabilitiamo il pulsante Aiuto dopo un piccolo ritardo per evitare conflitti
                setTimeout(() => {
                    if (bottoneAiuto) bottoneAiuto.disabled = true;
                }, 80);
                playClickSound();
            }
        };

        window.saltaDomanda = function() {
            console.log("saltaDomanda");
            if (gameOver || !giocoIniziato) return;
            if (indiceDomandaCorrente >= domande.length) return;
            indiceDomandaCorrente++;
            operazioniCorretteConsecutive = 0;
            aggiornaUI();
            mostraDomanda();
            playClickSound();
        };

        window.resetGioco = function() {
            console.log("resetGioco");
            punteggio = 0;
            vite = 3;
            erroriConsecutivi = 0;
            operazioniCorretteConsecutive = 0;
            aiutiUtilizzatiDomandaCorrente = 0;
            tempoRimanente = TEMPO_TOTALE;
            gameOver = false;
            prossimaSoglia = 100;
            mescolaDomande();
            indiceDomandaCorrente = 0;
            aggiornaViteUI();
            aggiornaDisplayPunteggio();
            aggiornaDisplayTempo();
            aggiornaIndicatoreErrori();
            aggiornaUI();
            if (giocoIniziato) {
                mostraDomanda();
            }
            if (bottoneAiuto) bottoneAiuto.disabled = false;
            if (timeoutProssima) {
                clearTimeout(timeoutProssima);
                timeoutProssima = null;
            }
            if (messaggioSpecialeTimeout) {
                clearTimeout(messaggioSpecialeTimeout);
                messaggioSpecialeTimeout = null;
            }
            if (messaggioSpeciale) messaggioSpeciale.classList.remove('mostra');
            body.classList.remove('messaggio-attivo');
            playClickSound();
        };

        window.apriIstruzioni = function() {
            document.getElementById('modal-overlay').style.display = 'flex';
            playClickSound();
        };
        window.chiudiIstruzioni = function() {
            document.getElementById('modal-overlay').style.display = 'none';
            playClickSound();
        };
        window.apriCommenti = function() {
            document.getElementById('comment-overlay').style.display = 'flex';
            playClickSound();
        };
        window.chiudiCommenti = function() {
            document.getElementById('comment-overlay').style.display = 'none';
            playClickSound();
        };
        window.esciDalGioco = function() {
            if (confirm("Vuoi davvero uscire dal gioco?")) {
                fermaTimer();
                window.location.href = "https://oragioca.github.io/matematica/";
            }
        };

        window.onload = function() {
            console.log("Pagina caricata");
            try {
                aggiornaViteUI();
                aggiornaDisplayPunteggio();
                aggiornaDisplayTempo();
                aggiornaIndicatoreErrori();
                aggiornaUI();
                inizializzaAudio();
            } catch (e) {
                console.error("Errore inizializzazione:", e);
                alert("Errore all'avvio: " + e.message);
            }

            document.getElementById('modal-overlay').addEventListener('click', (e) => {
                if (e.target === e.currentTarget) chiudiIstruzioni();
            });
            document.getElementById('comment-overlay').addEventListener('click', (e) => {
                if (e.target === e.currentTarget) chiudiCommenti();
            });
        };
    </script>
</body>
</html>
